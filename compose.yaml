services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dragonlord
      POSTGRES_USER: dragonlord
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["cafe-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dragonlord"]
      interval: 5s
      retries: 10
volumes:
  cafe-data:
